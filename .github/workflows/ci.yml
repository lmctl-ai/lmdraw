name: ci

on:
  workflow_dispatch:
    inputs:
      only:
        description: Run one platform or all platforms
        type: choice
        required: true
        default: all
        options: [all, linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["durable-memory/**", "docs/**", "**.md"]
  pull_request:
    paths-ignore: ["durable-memory/**", "docs/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: macos-15, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: windows-2022, name: windows-x64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    env:
      ONLY_OK: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || matrix.name == inputs.only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.ONLY_OK == 'true'
        with:
          persist-credentials: false
      - name: install build tools
        if: env.ONLY_OK == 'true'
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            command -v ninja >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build; }
          elif [[ "$RUNNER_OS" == macOS ]]; then
            command -v ninja >/dev/null 2>&1 || brew install ninja
          else
            if ! command -v g++ >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
              for attempt in 1 2 3; do
                choco install -y mingw ninja && break
                echo "Chocolatey attempt $attempt failed; retrying"
                sleep 20
              done
            fi
            command -v g++ >/dev/null 2>&1 || { echo "MinGW g++ is missing" >&2; exit 1; }
            command -v ninja >/dev/null 2>&1 || { echo "Ninja is missing" >&2; exit 1; }
            mkdir -p .ci-bin
            printf '#!/usr/bin/env bash\nexec python "$@"\n' > .ci-bin/python3
            chmod +x .ci-bin/python3
            export PATH="$PWD/.ci-bin:$PATH"
            echo "$PWD/.ci-bin" >> "$GITHUB_PATH"
          fi
          cmake --version
          ninja --version
          python3 --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.ONLY_OK == 'true'
        with:
          node-version: 24
      - name: install published lmscript compiler
        if: env.ONLY_OK == 'true'
        run: |
          npm install --global @lmctl-ai/lmctl@0.2.401
          scripts/select-compiler.sh | tee compiler.txt
      - name: verify SDK pin and test
        if: env.ONLY_OK == 'true'
        run: ./test.sh
      - name: audit runtime links
        if: env.ONLY_OK == 'true' && runner.os == 'Linux'
        run: |
          file build/lmdraw
          readelf -d build/lmdraw | grep NEEDED
          readelf -d build/lmdraw | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p' | while read -r lib; do
            case "$lib" in
              libc.so.6|libm.so.6|libpthread.so.0|libdl.so.2|librt.so.1|ld-linux*) ;;
              *) echo "::error::unexpected dynamic dependency: $lib"; exit 1;;
            esac
          done
      - name: audit macOS runtime links
        if: env.ONLY_OK == 'true' && runner.os == 'macOS'
        run: |
          otool -L build/lmdraw | tee otool.txt
          if grep -E '(@rpath|/opt/homebrew|/usr/local)' otool.txt; then
            echo 'unexpected non-system dependency' >&2; exit 1
          fi
      - name: audit Windows runtime links
        if: env.ONLY_OK == 'true' && runner.os == 'Windows'
        run: |
          objdump -p build/lmdraw.exe | tee imports.txt
          if grep -E 'DLL Name: (libstdc\+\+|libgcc|libwinpthread)' imports.txt; then
            echo 'unexpected MinGW runtime DLL' >&2; exit 1
          fi
      - name: stage binary
        if: env.ONLY_OK == 'true'
        run: |
          mkdir -p dist
          ext=""; [[ "$RUNNER_OS" == Windows ]] && ext=".exe"
          cp "build/lmdraw$ext" "dist/lmdraw-${{ matrix.name }}$ext"
          stat -c '%n %s bytes' dist/* 2>/dev/null || ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.ONLY_OK == 'true'
        with:
          name: lmdraw-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmdraw-*
          path: dist
          merge-multiple: true
      - name: stage licenses
        run: |
          version="$(sed -nE 's/^project\(lmdraw VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          [[ -n "$version" && "$GITHUB_REF_NAME" == "v$version" ]]
          chmod +x dist/lmdraw-linux-x64
          [[ "$(dist/lmdraw-linux-x64 --version)" == "lmdraw $version" ]]
          scripts/stage-release-notices.sh dist
          tar -czf dist/lmdraw-notices.tar.gz LICENSE THIRD_PARTY_NOTICES licenses
          rm -rf dist/licenses
          (cd dist && sha256sum lmdraw-* LICENSE THIRD_PARTY_NOTICES > SHA256SUMS)
      - name: attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes dist/*
          fi
